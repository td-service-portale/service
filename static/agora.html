<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#01212C">
<meta name="description" content="Agorà, il blog del Service di Laboratorio di Toscana Diagnostica: esperienze, opinioni e approfondimenti per chi fa diagnostica.">
<title>Agorà · Toscana Diagnostica Service</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
.post-list .tile { padding: 18px 20px; }
.post-list .tile .name { font-size: 17px; font-weight: 800; }
.post-list .tile .sub { font-size: 13.5px; margin-top: 6px; }
.post-list .meta { font-size: 12px; color: var(--muted); margin-top: 10px; }
.article { max-width: 820px; }
.article h1 { font-size: 30px; line-height: 1.2; }
.article .byline { color: var(--muted); font-size: 13.5px; margin: 10px 0 22px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.article .byline .av { width: 34px; height: 34px; border-radius: 50%; background: var(--teal); color: #fff; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
.article .body p { font-size: 16px; line-height: 1.7; margin: 0 0 16px; color: #1b2f36; }
.article .body p:first-child::first-letter { font-size: 2.6em; font-weight: 800; color: var(--teal); float: left; line-height: .85; padding: 4px 8px 0 0; }
.newsletter { background: linear-gradient(135deg, var(--jet), var(--teal)); color: #fff; border-radius: var(--radius); padding: 26px 28px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center; }
.newsletter h2 { color: #fff; font-size: 19px; }
.newsletter p { color: #cfe3e7; margin: 6px 0 0; max-width: 520px; font-size: 14px; }
.nlf { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 16px; }
.nlf .row1 { display: flex; gap: 8px; }
.nlf input[type=email] { flex: 1; min-height: 44px; border: 0; border-radius: 9px; padding: 0 14px; font-size: 15px; background: #fff; color: var(--ink); }
.nlf input[type=email]:focus { box-shadow: 0 0 0 3px rgba(222,192,241,.6); }
.nlf .btn { background: var(--silk); color: var(--jet); min-height: 44px; padding: 0 18px; border-radius: 9px; }
.nlf .btn:hover { background: #fff; }
.nlf .btn[disabled] { opacity: .6; cursor: wait; }
.nlf label.ck { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 12.5px; color: #dbe9ec; cursor: pointer; line-height: 1.4; }
.nlf label.ck input { width: 17px; height: 17px; min-height: 0; margin: 1px 0 0; accent-color: var(--mauve); flex: none; }
.nlf label.ck a { color: var(--silk); text-decoration: underline; }
.nlf .msg { margin-top: 10px; font-size: 13px; font-weight: 650; display: none; }
.nlf .msg.ok { display: block; color: var(--silk); }
.nlf .msg.err { display: block; color: #ffd0cb; }
.nlf .hp { position: absolute; left: -9999px; opacity: 0; height: 0; }
.newsletter iframe { width: 100%; max-width: 560px; border: 0; height: 320px; background: #fff; border-radius: 10px; grid-column: 1 / -1; justify-self: center; }
@media (max-width: 860px) { .newsletter { grid-template-columns: 1fr; } .article h1 { font-size: 24px; } .nlf .row1 { flex-direction: column; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="page">
      <div id="content"></div>
      <div class="mt" id="newsletter"></div>
      <footer class="foot" id="footer"></footer>
    </div>
  </main>
</div>
<script src="/static/shell.js"></script>
<script>
(function () {
  const { icon, esc, shell, footer, copy } = window.SGI;
  const $ = id => document.getElementById(id);
  const slugFromPath = () => { const m = location.pathname.match(/^\/agora\/([^/]+)/); return m ? decodeURIComponent(m[1]) : null; };
  Promise.all([window.SGI.menuReady, fetch('/data/blog.json').then(r => r.json()), fetch('/api/meta').then(r => r.json())]).then(([_m, B, m]) => {
    const posts = (B.post || []).slice().sort((a, b) => b.data.split('/').reverse().join('') .localeCompare(a.data.split('/').reverse().join('')));
    shell({ page: 'agora', meta: m, aree: null, shortcuts: posts.slice(0, 6).map(p => ({ icon: 'book', label: p.titolo, href: '/agora/' + p.slug })) });
    footer(m);
    const slug = slugFromPath();
    const post = slug ? posts.find(p => p.slug === slug) : null;
    if (slug && !post) { location.replace('/agora'); return; }
    if (post) {
      document.title = post.titolo + ' · Agorà · Toscana Diagnostica';
      const ini = post.autore.split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase();
      $('content').innerHTML = `
        <div class="small" style="margin-bottom:14px"><a href="/agora">${icon('book', 14)} Agorà</a> <span class="muted">· ${esc(post.data)}</span></div>
        <article class="article">
          <h1>${esc(post.titolo)}</h1>
          <div class="byline"><span class="av">${esc(ini)}</span><span><strong>${esc(post.autore)}</strong><br>${esc(post.ruolo || '')}</span><span class="spacer"></span><span>${esc(post.data)}${post.tempo ? ' · lettura ' + esc(post.tempo) : ''}</span></div>
          <div class="body">${post.corpo.map(p => `<p>${esc(p)}</p>`).join('')}</div>
          <div class="row mt"><button class="btn sm ghost" id="share">${icon('link', 14)} Copia il link all'articolo</button><a class="btn sm ghost" href="mailto:?subject=${encodeURIComponent(post.titolo + ' · Agorà Toscana Diagnostica')}&body=${encodeURIComponent(location.href)}">${icon('mail', 14)} Invia per e-mail</a></div>
        </article>`;
      $('share').addEventListener('click', () => copy(location.href, 'Link copiato', post.titolo));
    } else {
      $('content').innerHTML = `
        <div class="page-head"><div><h1>${esc(B.titolo)}</h1><div class="sub">${esc(B.sottotitolo)}</div></div></div>
        <div class="tiles post-list" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">
          ${posts.map(p => `<a class="tile" href="/agora/${esc(p.slug)}"><div class="name">${esc(p.titolo)}</div><div class="sub">${esc(p.sommario)}</div><div class="meta">${esc(p.autore)} · ${esc(p.data)}${p.tempo ? ' · ' + esc(p.tempo) : ''}</div></a>`).join('')}
        </div>`;
    }
    const N = B.newsletter || {};
    const consenso = (N.consenso || "Ho letto l'Informativa Privacy e acconsento a ricevere la newsletter.").replace("Informativa Privacy", `<a href="${esc(N.privacy_url || '#')}" target="_blank" rel="noopener">Informativa Privacy</a>`);
    $('newsletter').innerHTML = `<div class="newsletter">
      <div><h2>${esc(N.titolo || 'Newsletter')}</h2><p>${esc(N.testo || '')}</p></div>
      ${N.brevo_action ? `
      <form class="nlf" id="nlf" novalidate>
        <div class="row1"><input type="email" name="EMAIL" id="nlEmail" placeholder="La tua e-mail" autocomplete="email" required><button class="btn" type="submit" id="nlBtn">Iscriviti</button></div>
        <label class="ck"><input type="checkbox" id="nlOk" name="CONSENSO_PRIVACY" value="1"><span>${consenso}</span></label>
        <input class="hp" type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off"><input type="hidden" name="locale" value="it">
        <div class="msg" id="nlMsg"></div>
      </form>` : N.brevo_url ? `<iframe src="${esc(N.brevo_url)}" title="Iscrizione newsletter" loading="lazy" scrolling="auto"></iframe>` :
        `<a class="btn" href="mailto:${esc(N.fallback_email || 'service@toscanadiagnostica.it')}?subject=${encodeURIComponent('Iscrizione newsletter Agorà')}">${icon('mail', 16)} Iscriviti</a>`}
    </div>`;
    const f = $('nlf');
    if (f) f.addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('nlEmail').value.trim(), msg = $('nlMsg'), btn = $('nlBtn');
      const show = (t, ok) => { msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'err'); };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return show('Inserisci un indirizzo e-mail valido.', false);
      if (!$('nlOk').checked) return show("Per iscriverti devi accettare l'Informativa Privacy.", false);
      btn.disabled = true; btn.textContent = 'Invio…';
      const fd = new FormData(f);
      try {
        const r = await fetch(N.brevo_action + '?isAjax=1', { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
        const j = await r.json().catch(() => ({}));
        if (r.ok && (j.success || j.success === undefined)) { show(N.grazie || 'Grazie, iscrizione registrata.', true); f.reset(); }
        else show((j.errors && (Object.values(j.errors)[0] || [])[0]) || j.message || 'Iscrizione non riuscita, riprova tra qualche minuto.', false);
      } catch (err) {
        /* rete o CORS: invio classico verso un frame nascosto, che Brevo accetta sempre */
        const ifr = document.createElement('iframe'); ifr.name = 'nlTarget'; ifr.style.display = 'none'; document.body.appendChild(ifr);
        const g = document.createElement('form'); g.method = 'POST'; g.action = N.brevo_action; g.target = 'nlTarget'; g.style.display = 'none';
        for (const [k, v] of fd.entries()) { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; g.appendChild(i); }
        document.body.appendChild(g); g.submit();
        show(N.grazie || 'Grazie, iscrizione registrata.', true); f.reset();
      }
      btn.disabled = false; btn.textContent = 'Iscriviti';
    });
  });
})();
</script>
</body>
</html>
